<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Immediate theme and sidebar check to prevent flash
			try {
				const theme = localStorage.getItem('eisen-theme');
				if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
				if (localStorage.getItem('eisen-sidebar-collapsed') === 'true') {
					document.documentElement.classList.add('sidebar-collapsed');
				}
				const accent = localStorage.getItem('eisen-accent-color') || 'blue';
				document.documentElement.setAttribute('data-accent', accent);
				if (localStorage.getItem('eisen-rounded') === 'true') {
					document.documentElement.classList.add('rounded-ui');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="preload">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
